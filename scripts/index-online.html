<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2016">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="松鼠大战">
<title>松鼠大战 Online</title>
<link rel="manifest" href="images/ui/web/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="images/ui/web/favicon.svg">
<link rel="apple-touch-icon" href="images/ui/web/icon-180.png">
<style>
/* iOS / 安卓 WebView 的触摸约定（安装包内页面也走这一份入口）。 */
@supports (-webkit-touch-callout: none) {
  html, body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body { -webkit-touch-callout: none; }
  button, input { touch-action: manipulation; }
}
@supports not (-webkit-touch-callout: none) {
  #app, #app * { touch-action: manipulation; }
}
</style>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/classic.css">
<link rel="stylesheet" href="css/classic-extras.css">
<link rel="stylesheet" href="css/classic-fusion.css">
<link rel="stylesheet" href="css/battle-drops.css">
<link rel="stylesheet" href="css/classic-refine.css">
<!-- 联机版新增的少量交互件（登录表单 / 对手列表）：原版没有对应素材 -->
<link rel="stylesheet" href="css/online.css">
<!-- 纯网页端的手机安全区 / 竖屏提示；安装包也加载，但提示只在 http(s) 页面启用 -->
<link rel="stylesheet" href="css/web.css">
<!-- 文字描边的唯一出口：安卓 WebView 不认 HTML 文本的 paint-order，改走 text-shadow 回退 -->
<link rel="stylesheet" href="css/text-outline.css">
<!-- 联机标记必须先于任何游戏脚本置位：state.js 靠它决定「只经典 + 不落本地存档」。 -->
<script>
window.__SSDZ_ONLINE__ = true;
// 安卓描边回退（css/text-outline.css）要在首帧前就命中。
if (/Android/i.test(navigator.userAgent || '')) document.documentElement.classList.add('is-android');
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
});
</script>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="boot-note">正在连接服务器…</div>
</div>

<div id="rotate-hint" aria-hidden="true">
  <div class="web-rotate-card">
    <div class="web-rotate-phone" aria-hidden="true"></div>
    <h2 class="web-rotate-title">请横屏游玩</h2>
    <p class="web-rotate-text">松鼠大战是横向画面，横屏后按钮和文字更大、更好点。<br>旋转手机，或点下面的按钮继续。</p>
    <button type="button" class="web-rotate-continue" data-rotate-continue>仍要竖屏游玩</button>
  </div>
</div>

<!-- 昵称长度：注册页 / 修改昵称 / 服务端 auth 共用同一份 7 个汉字口径 -->
<script src="js/nickname.js"></script>
